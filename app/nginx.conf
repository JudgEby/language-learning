# Nginx config for the Language Learning SPA (single static site, no backend).
# - SPA routes (/:level/rules/...) fall back to index.html.
# - /content/*.json is immutable per build (a new deploy ships a new service
#   worker with a fresh cache), so it is cached aggressively.
# - index.html and sw.js must never be cached, otherwise clients stick to an
#   old shell/worker after a deploy.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Immutable lesson/test payloads baked into this build.
  location /content/ {
    expires 90d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker and app shell: always fresh.
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /index.html {
    expires off;
    add_header Cache-Control "no-store";
  }

  # Everything else: static file or SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
