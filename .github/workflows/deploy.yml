# Deploy the SPA to the production server on every push to main.
#
# How it works: the `verify` job rebuilds the bundle from scratch (typecheck,
# content validation, production build). If it passes, the `deploy` job SSHes
# into the server, fast-forwards /opt/lang-app to origin/main and rebuilds
# the container there (`docker compose up -d --build`).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST  — server address (e.g. 5.35.126.130)
#   SSH_USER  — SSH user that owns /opt/lang-app and can run docker
#   SSH_KEY   — private OpenSSH key for SSH_USER (public part in ~/.ssh/authorized_keys)
#   SSH_PORT  — SSH port (22 unless changed)
#
# One-time server setup:
#   git clone <repo-url> /opt/lang-app && cd /opt/lang-app
#   docker compose up -d --build
# Afterwards every push to main redeploys automatically.

name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Validate content
        run: |
          for level in A2 A2+ B1 B2 B2+; do
            python scripts/validate_level.py "$level"
          done

      - name: Production build
        working-directory: app
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild container on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/lang-app
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
